plugins { id 'java' }

group = 'com.stashledger'
version = '0.1.0'
repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}
// Plugin Hub's verified client version on 2026-11-10. Keep builds reproducible.
def runeLiteVersion = '1.13.6'
sourceSets {
    launcher {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    launcherImplementation "net.runelite:client:${runeLiteVersion}"
    launcherImplementation "net.runelite:jshell:${runeLiteVersion}"
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
tasks.named('processResources') {
    from(['LICENSE', 'THIRD_PARTY_NOTICES']) { into 'META-INF/stash-ledger' }
    from('runelite-plugin.properties')
}
tasks.withType(Test).configureEach {
    maxParallelForks = 1
    systemProperty 'java.awt.headless', 'true'
    testLogging { events 'passed', 'skipped', 'failed' }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.register('run', JavaExec) {
    dependsOn launcherClasses
    classpath = sourceSets.launcher.runtimeClasspath
    mainClass = 'com.stashledger.StashLedgerLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}
tasks.register('shadowJar', Jar) {
    dependsOn launcherClasses
    archiveClassifier = 'all'
    manifest { attributes('Main-Class': 'com.stashledger.StashLedgerLauncher', 'Multi-Release': true) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.launcher.output
    from { configurations.launcherRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
}
